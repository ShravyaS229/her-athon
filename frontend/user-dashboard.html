<!DOCTYPE html>
<html>
<head>
<title>User Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#4f46e5;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    margin-top:30px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

textarea{
    width:100%;
    height:80px;
    padding:10px;
    border-radius:6px;
    border:1px solid #ccc;
    margin-top:10px;
}

button{
    margin-top:10px;
    padding:10px 16px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#4338ca;
}

.request-card{
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    background:#fafafa;
}

#map{
    height:400px;
    margin-top:20px;
    border-radius:10px;
}

@media(max-width:800px){
    .grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<header>
<h1>CareConnect – User Dashboard</h1>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h2>Request Help</h2>

<textarea id="description" placeholder="Describe your emergency"></textarea>

<button onclick="createRequest()">Request Help</button>

</div>

<div class="card">
<h2>Your Active Requests</h2>

<div id="requests"></div>

</div>

</div>

<div class="card">
<h2>Requests Map</h2>

<div id="map"></div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
