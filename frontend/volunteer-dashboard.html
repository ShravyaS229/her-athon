<!DOCTYPE html>
<html>
<head>
<title>Volunteer Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

header{
    background:#16a34a;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1100px;
    margin:auto;
    margin-top:30px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.request-card{
    border:1px solid #ddd;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    background:#fafafa;
}

.request-card p{
    margin:5px 0;
}

button{
    padding:6px 12px;
    margin-right:8px;
    margin-top:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.accept-btn{
    background:#16a34a;
    color:white;
}

.accept-btn:hover{
    background:#138439;
}

.reject-btn{
    background:#dc2626;
    color:white;
}

.reject-btn:hover{
    background:#b91c1c;
}

#map{
    height:400px;
    border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>CareConnect – Volunteer Dashboard</h1>
</header>

<div class="container">

<div class="card">
<h2>Nearby Help Requests</h2>
<div id="map"></div>
</div>

<div class="card">
<h2>Requests List</h2>
<div id="requests"></div>
</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="js/app.js"></script>

<script>
// Load requests with Accept / Reject buttons
async function loadRequests(){
    const res = await fetch(API + "/api/requests/all");
    const data = await res.json();
    const container = document.getElementById("requests");
    container.innerHTML = "";
    
    data.forEach(r => {
        const div = document.createElement("div");
        div.className = "request-card";
        div.innerHTML = `
            <p><strong>Description:</strong> ${r.description}</p>
            <p><strong>Status:</strong> ${r.status || "Pending"}</p>
            <button class="accept-btn" onclick="acceptRequest('${r.id}')">Accept</button>
            <button class="reject-btn" onclick="rejectRequest('${r.id}')">Reject</button>
        `;
        container.appendChild(div);
    });
}

// Dummy accept/reject functions (replace with your API calls)
async function acceptRequest(id){
    await fetch(`${API}/api/requests/accept/${id}`, {method:"POST"});
    alert("Request Accepted");
    loadRequests();
    loadMap(); // update map status
}

async function rejectRequest(id){
    await fetch(`${API}/api/requests/reject/${id}`, {method:"POST"});
    alert("Request Rejected");
    loadRequests();
    loadMap(); // update map status
}

// Call this on page load
window.onload = () => {
    loadRequests();
    loadMap();
};
</script>

</body>
</html>
