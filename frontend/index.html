<!DOCTYPE html>
<html>
<head>
<title>CareConnect – Emergency Help Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">

<style>
body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(to right, #d9f0ff, #ffffff);
    margin: 0;
    padding: 0;
    display: flex;
    min-height: 100vh;
    flex-direction: column;
}

header {
    background: #0284c7; /* trust blue */
    color: white;
    padding: 50px 20px 30px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

header h1 {
    margin: 0;
    font-size: 2.5rem;
}

header p {
    margin-top: 10px;
    font-size: 1.2rem;
    font-weight: 400;
}

.container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.card {
    background: white;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    text-align: center;
    max-width: 400px;
    width: 100%;
}

.card h2 {
    margin-bottom: 30px;
    color: #0284c7;
}

.card a {
    display: block;
    padding: 14px 0;
    margin: 12px 0;
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    border-radius: 10px;
    transition: 0.3s ease;
}

.card a:hover {
    transform: translateY(-2px);
}

/* Individual button styles */
.register-user {
    background: #16a34a;
    color: white;
}

.register-user:hover {
    background: #138439;
}

.register-volunteer {
    background: #f59e0b;
    color: white;
}

.register-volunteer:hover {
    background: #d97706;
}

.login {
    background: #0284c7;
    color: white;
}

.login:hover {
    background: #0369a1;
}
</style>
</head>

<body>

<header>
<h1>🚨 CareConnect</h1>
<p>Connect with nearby volunteers instantly</p>
</header>

<div class="container">
<div class="card">
<h2>Get Started</h2>

<a href="register-user.html" class="register-user">Register as User</a>
<a href="register-volunteer.html" class="register-volunteer">Register as Volunteer</a>
<a href="login.html" class="login">Login</a>

</div>
</div>

</body>
</html>
